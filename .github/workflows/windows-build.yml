name: Windows build

# On every push to main (and on demand): run the tests, build the GUI and the
# engine for Windows, package an installer (Inno Setup) and a portable zip,
# and publish them as a GitHub Release tagged from pubspec.yaml's version.
# The download page (docs/index.html, served by GitHub Pages) always links
# to the newest release.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Read version from pubspec.yaml
        id: version
        shell: bash
        run: |
          version=$(grep '^version:' pubspec.yaml | sed 's/version: *//' | tr -d '\r')
          echo "full=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v${version%+*}" >> "$GITHUB_OUTPUT"

      # Every update must carry a new version, so the version in the app
      # always tells which build it is. A version already released fails here.
      - name: Refuse an already-released version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.version.outputs.tag }}"
          if gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "::error::$tag is already released. Bump version: in pubspec.yaml and CoreConstants.appVersion."
            exit 1
          fi

      - name: Build GUI (release)
        run: flutter build windows --release

      - name: Build engine (release)
        run: dart compile exe bin\engine.dart -o build\windows\x64\runner\Release\trading_pionex_engine.exe

      - name: Package portable zip
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath TradingPionex-Windows-${{ steps.version.outputs.full }}.zip

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      # Flutter's Windows build needs the VC++ runtime, which a fresh Windows
      # may not have. Fetched from Microsoft each run, never committed.
      - name: Download VC++ Redistributable
        run: Invoke-WebRequest -Uri https://aka.ms/vs/17/release/vc_redist.x64.exe -OutFile windows_installer\vc_redist.x64.exe

      - name: Build installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion=${{ steps.version.outputs.full }} windows_installer\tradingpionex.iss

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: TradingPionex ${{ steps.version.outputs.tag }}
          files: |
            installer_output\TradingPionex-Setup-${{ steps.version.outputs.full }}.exe
            TradingPionex-Windows-${{ steps.version.outputs.full }}.zip
          make_latest: true
